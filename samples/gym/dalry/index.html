<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Dalry Community Sports Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root { --ink:#090A0F; --volt:#D4FF24; --sage:#A5A79B; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--ink); color: #fff; font-family: 'Inter', system-ui, sans-serif; overflow-x: hidden; }
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; display: block; }
  #loader { position: fixed; inset: 0; z-index: 50; background: var(--ink); display: grid; place-items: center;
    font-family: 'Barlow Condensed', sans-serif; letter-spacing: .4em; text-transform: uppercase; color: var(--volt); transition: opacity .8s; }
  #loader.done { opacity: 0; pointer-events: none; }

  main { position: relative; }
  section { position: relative; z-index: 10; min-height: 100vh; width: 100%; display: flex; flex-direction: column; padding: 7rem 1.5rem; }
  .display { font-family: 'Barlow Condensed', sans-serif; text-transform: uppercase; font-weight: 800; line-height: 1; }
  .eyebrow { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; text-transform: uppercase; letter-spacing: .4em; font-size: .85rem; color: var(--volt); }
  .muted { color: var(--sage); }
  [data-reveal] { visibility: hidden; }

  .center { align-items: center; justify-content: space-between; text-align: center; }
  h1.display { font-size: clamp(3rem, 11vw, 7.5rem); margin-top: 1rem; }
  h2.display { font-size: clamp(2.4rem, 7vw, 5.5rem); font-weight: 700; }
  .tagline { max-width: 36rem; margin: 0 auto; font-size: 1.15rem; }
  .scroll-hint { margin-top: 2rem; font-size: .7rem; letter-spacing: .3em; text-transform: uppercase; }

  .block { max-width: 34rem; }
  .block p.desc { margin-top: 1.25rem; font-size: 1.05rem; line-height: 1.6; }
  .points { list-style: none; margin-top: 2rem; display: grid; gap: .8rem; }
  .points li { border-left: 2px solid var(--volt); padding-left: 1rem; }

  .fixtures { display: grid; gap: .75rem; margin-top: 2rem; }
  .fixture { display: flex; justify-content: space-between; gap: 1rem; align-items: center; padding: 1rem 1.25rem; border-radius: .9rem;
    border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.03); backdrop-filter: blur(6px); }
  .fixture .date { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; letter-spacing: .15em; color: var(--volt); font-size: .9rem; }
  .fixture .match { margin-top: .2rem; }
  .fixture .meta { text-align: right; font-size: .85rem; color: var(--sage); }

  .btn { display: inline-block; text-decoration: none; background: var(--volt); color: var(--ink); padding: 1rem 2.5rem; border-radius: 999px;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 1.15rem; text-transform: uppercase; letter-spacing: .15em; transition: transform .25s, box-shadow .25s; }
  .btn:hover { transform: scale(1.05); box-shadow: 0 0 40px rgba(212,255,36,.45); }
  .copy { margin-top: 2.5rem; font-size: .75rem; color: var(--sage); }

  /* Mobile: text sits at the bottom, ball floats up top */
  @media (max-width: 767px) { #about, #fixtures { justify-content: flex-end; padding-bottom: 5rem; } }
  /* Desktop: about text left, fixtures text right */
  @media (min-width: 768px) {
    section { padding-left: 4rem; padding-right: 4rem; }
    #about, #fixtures { justify-content: center; }
    #fixtures { align-items: flex-end; }
    #fixtures .block { width: 100%; max-width: 36rem; }
  }
  @media (min-width: 1024px) { section { padding-left: 6rem; padding-right: 6rem; } }
</style>
</head>

<div id="loader">Loading</div>
<canvas id="bg"></canvas>
<main id="root"></main>

    </section>

    <section data-section id="fixtures">

        <h2 data-reveal class="display">${s.fixtures.title}</h2>

        <div class="fixtures">
          ${s.fixtures.list.map(f => `
            <div data-reveal class="fixture">
              <div><div class="date">${f.date}</div><div class="match">${f.match}</div></div>
              <div class="meta"><div>${f.time}</div><div>${f.venue}</div></div>
            </div>`).join("")}
        </div>
      </div>
    </section>

    <section data-section class="center">
      <div data-reveal>
        <h2 class="display" style="font-size:clamp(3rem,11vw,7.5rem)">${c.contact.title}</h2>
        <p class="tagline muted" style="margin-top:1rem">${c.contact.desc}</p>
      </div>
      <div data-reveal>
        <a class="btn" href="${c.contact.href}">${c.contact.cta}</a>
        <p class="copy">© ${new Date().getFullYear()} ${c.name}</p>
      </div>
    </section>`;
})();

const canvas = document.getElementById("bg");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
camera.position.set(0, 0, 6);

// Lighting: soft fill + shadow-casting key + lime rim
scene.add(new THREE.AmbientLight(0xffffff, 0.4));
const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.position.set(4, 5, 5);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.bias = -0.0004;
scene.add(key);
const rim = new THREE.PointLight(0xd4ff24, 30, 0, 2);
rim.position.set(-5, -2, 2);
scene.add(rim);

// Local studio reflections (no external HDR needed) so the white ball really pops
(function buildEnvironment() {
  const env = new THREE.Scene();
  const panel = (w, h, x, y, z, intensity) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color().setScalar(intensity), side: THREE.DoubleSide }));
    m.position.set(x, y, z); m.lookAt(0, 0, 0); env.add(m);
  };
  panel(10, 4, 0, 5, -4, 4);
  panel(3, 6, -5, 1, 2, 2);
  panel(3, 6, 5, 1, 2, 2);
  panel(8, 8, 0, 6, 4, 1.2);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(env, 0.04).texture;
  pmrem.dispose();
})();

// Values animated by GSAP, read by the render loop.
// x / y: -1..1 of half the viewport (+x right, +y up) | scale: fraction of the smaller viewport side
const ball = { x: 0, y: 0, z: 0, rx: 0.15, ry: 0, rz: 0, scale: 0.8, spin: 0.35 };

const holder = new THREE.Group();
holder.scale.setScalar(0.001);
scene.add(holder);
let fit = 1;

function loadModel() {
  const bin = atob(MODEL_B64);
  const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);

  new THREE.GLTFLoader().parse(buf.buffer, "", (gltf) => {
    const model = gltf.scene;
    // centre + normalise so any GLB size/pivot works
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    model.position.sub(box.getCenter(new THREE.Vector3()));
    model.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    fit = 1 / Math.max(size.x, size.y, size.z);
    holder.add(model);
    document.getElementById("loader").classList.add("done");
  }, (err) => {
    console.error("Model failed to load", err);
    document.getElementById("loader").textContent = "Model error";
  });
}

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", () => { resize(); ScrollTrigger.refresh(); });
resize();

const clock = new THREE.Clock();
let autoSpin = 0;
const damp = THREE.MathUtils.damp;

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  const vh = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.position.z;
  const vw = vh * camera.aspect;
  const unit = Math.min(vw, vh);
  const L = 6; // follow snappiness (higher = snappier)

  autoSpin += dt * ball.spin;
  holder.position.x = damp(holder.position.x, ball.x * vw / 2, L, dt);
  holder.position.y = damp(holder.position.y, ball.y * vh / 2, L, dt);
  holder.position.z = damp(holder.position.z, ball.z, L, dt);
  holder.rotation.x = damp(holder.rotation.x, ball.rx, L, dt);
  holder.rotation.y = damp(holder.rotation.y, ball.ry + autoSpin, L, dt);
  holder.rotation.z = damp(holder.rotation.z, ball.rz, L, dt);
  holder.scale.setScalar(damp(holder.scale.x, ball.scale * unit * fit, L, dt));

  renderer.render(scene, camera);
});

loadModel();

/* ============================================================
   4. GSAP SCROLL TIMELINE  <-- tweak the animation here
   Positions: x/y in -1..1, sizes as fraction of smaller viewport side.
   ============================================================ */
const LAYOUT = {
  desktop: { hero: 0.8, aboutX: 0.5,  aboutY: 0,   about: 0.5,  fixX: -0.5,  fixY: 0,   fix: 0.55, footY: -0.3,  foot: 0.4 },
  mobile:  { hero: 0.7, aboutX: 0.28, aboutY: 0.5, about: 0.34, fixX: -0.28, fixY: 0.5, fix: 0.34, footY: -0.25, foot: 0.35 }
};

gsap.registerPlugin(ScrollTrigger);
const mm = gsap.matchMedia();

mm.add({ desktop: "(min-width: 768px)", mobile: "(max-width: 767px)" }, (ctx) => {
  const P = ctx.conditions.desktop ? LAYOUT.desktop : LAYOUT.mobile;
  gsap.set(ball, { scale: P.hero });

  // MASTER TIMELINE: 1 unit = 1 section (4 sections = 3 transitions), scrubbed to scroll.
  // scrub: 1.2 = smoothing in seconds. Higher = floatier.
  const tl = gsap.timeline({
    defaults: { ease: "power2.inOut", duration: 1 },
    scrollTrigger: { trigger: "#root", start: "top top", end: "bottom bottom", scrub: 1.2 }
  });

  tl
    // Hero -> About: shrink, glide RIGHT, spin faster
    .to(ball, { x: P.aboutX, y: P.aboutY, scale: P.about, rx: 0.3, ry: Math.PI * 2, spin: 1.8 }, 0)
    // About -> Fixtures: slide LEFT, change tilt
    .to(ball, { x: P.fixX, y: P.fixY, scale: P.fix, rx: 0.9, rz: 0.5, ry: Math.PI * 4, spin: 0.7 }, 1)
    // Fixtures -> Footer: re-centre and roll down toward the contact button
    .to(ball, { x: 0, y: P.footY, scale: P.foot, rx: 0, rz: Math.PI * 2, ry: Math.PI * 6, spin: 0.4 }, 2);

  // TEXT REVEALS: fade/slide in when a section is ~in view, reverse on exit
  gsap.utils.toArray("[data-section]").forEach((sec) => {
    gsap.fromTo(sec.querySelectorAll("[data-reveal]"),
      { autoAlpha: 0, y: 40 },
      { autoAlpha: 1, y: 0, duration: 0.9, stagger: 0.12, ease: "power3.out",
        scrollTrigger: { trigger: sec, start: "top 55%", end: "bottom 30%", toggleActions: "play reverse play reverse" } });
  });
});
</script>
</body>
</html>
