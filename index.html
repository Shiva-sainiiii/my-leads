<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0F1115">
<title>Website Samples</title>
<style>
  :root{
    --bg:#0F1115; --panel:#15171D; --panel-hover:#1B1E26; --border:#262A33;
    --text:#E8E6E1; --dim:#8A8F9C; --faint:#565B68;
    --accent:#6C9BFF; --accent-dim:#3A4B7A; --tpl:#4FD1C5;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:1000px;margin:0 auto;padding:36px 18px 80px}
  h1{font-size:26px;font-weight:600;letter-spacing:-.01em;margin:0 0 6px}
  .sub{color:var(--dim);font-size:14px;line-height:1.5;margin:0}
  .stats{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;color:var(--faint);margin-top:14px}

  /* controls */
  .controls{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 85%,transparent);
    padding:16px 0 10px;margin-top:18px}
  .search{width:100%;background:var(--panel);border:1px solid var(--border);border-radius:10px;
    color:var(--text);font-size:15px;padding:12px 14px;outline:none}
  .search::placeholder{color:var(--faint)}
  .search:focus{border-color:var(--accent-dim)}
  .filters{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .fchip{flex:none;font:inherit;font-size:13px;color:var(--dim);background:transparent;
    border:1px solid var(--border);border-radius:999px;padding:7px 13px;cursor:pointer;white-space:nowrap}
  .fchip b{font-weight:500;color:var(--faint);margin-left:5px}
  .fchip:hover{border-color:var(--accent-dim);color:var(--text)}
  .fchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#0b1020}
  .fchip[aria-pressed="true"] b{color:#0b1020aa}
  .fchip.safe[aria-pressed="true"]{background:var(--tpl);border-color:var(--tpl)}
  .sep{flex:none;width:1px;background:var(--border);margin:2px 2px}

  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--faint);margin:6px 0 4px}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:-1px}
  .dot.t{background:var(--tpl)}
  .dot.r{border:1.5px solid var(--dim)}

  /* sections + sample chips */
  section{margin-top:26px}
  section h2{display:flex;align-items:baseline;gap:8px;font-size:12px;font-weight:600;letter-spacing:.08em;
    text-transform:uppercase;color:var(--dim);margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid var(--border)}
  section h2 span{font-family:ui-monospace,monospace;color:var(--faint);font-weight:400;letter-spacing:0}
  .chips{display:flex;flex-wrap:wrap;gap:9px}
  .chip{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--text);
    background:var(--panel);border:1px solid var(--border);border-radius:10px;
    padding:11px 14px;font-size:14.5px;line-height:1.25;
    transition:background-color .15s,border-color .15s,transform .15s}
  .chip:hover{background:var(--panel-hover);border-color:var(--accent-dim);transform:translateY(-1px)}
  .chip:hover .nm{color:var(--accent)}
  .chip:focus-visible,.fchip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .chip .dot{margin:0;flex:none}
  .chip.tpl{border-color:#24473f}
  .empty{color:var(--faint);font-size:14px;padding:44px 0;text-align:center;
    font-family:ui-monospace,monospace}
  @media(max-width:520px){
    .wrap{padding:28px 14px 64px}
    h1{font-size:22px}
    .chip{font-size:14px;padding:11px 12px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Website Samples</h1>
    <p class="sub">Tap any name to open that sample.</p>
    <div class="stats" id="stats"></div>
  </header>

  <div class="controls">
    <input class="search" id="q" type="search" placeholder="Search sample name…" autocomplete="off" aria-label="Search samples">
    <div class="filters" id="filters"></div>
  </div>

  <div class="legend">
    <span><i class="dot t"></i>Template (placeholder name)</span>
    <span><i class="dot r"></i>Real business name</span>
  </div>

  <main id="list"></main>
</div>

<script src="samples-data.js"></script>
<script>
(function(){
  var CATS = window.CATEGORIES, ALL = window.SAMPLES;
  var state = { cat: 'all', q: '', safe: /[?&]templates=1/.test(location.search) };
  var $ = function(s){ return document.querySelector(s); };
  var esc = function(s){ return String(s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };

  function visible(s){
    if (state.safe && !s.template) return false;
    if (state.cat !== 'all' && s.cat !== state.cat) return false;
    if (state.q && s.name.toLowerCase().indexOf(state.q) === -1) return false;
    return true;
  }

  function renderFilters(){
    var base = ALL.filter(function(s){ return !state.safe || s.template; });
    var html = '<button class="fchip" data-cat="all" aria-pressed="'+(state.cat==='all')+'">All<b>'+base.length+'</b></button>';
    CATS.forEach(function(c){
      var n = base.filter(function(s){ return s.cat===c.id; }).length;
      if (!n) return;
      html += '<button class="fchip" data-cat="'+c.id+'" aria-pressed="'+(state.cat===c.id)+'">'+esc(c.label)+'<b>'+n+'</b></button>';
    });
    html += '<span class="sep"></span><button class="fchip safe" id="safe" aria-pressed="'+state.safe+'">Templates only</button>';
    $('#filters').innerHTML = html;
  }

  function renderList(){
    var out = '', shown = 0;
    CATS.forEach(function(c){
      var items = ALL.filter(function(s){ return s.cat===c.id && visible(s); });
      if (!items.length) return;
      shown += items.length;
      out += '<section><h2>'+esc(c.label)+' <span>'+items.length+'</span></h2><div class="chips">' +
        items.map(function(s){
          return '<a class="chip'+(s.template?' tpl':'')+'" href="samples/'+s.path+'/">' +
                 '<i class="dot '+(s.template?'t':'r')+'"></i><span class="nm">'+esc(s.name)+'</span></a>';
        }).join('') + '</div></section>';
    });
    $('#list').innerHTML = out || '<div class="empty">No sample matches.</div>';
    var t = ALL.filter(function(s){ return s.template; }).length;
    $('#stats').textContent = ALL.length + ' samples · ' + t + ' templates · ' + (ALL.length-t) + ' real names';
  }

  function render(){ renderFilters(); renderList(); }

  $('#filters').addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    if (b.id === 'safe') { state.safe = !state.safe; }
    else { state.cat = b.getAttribute('data-cat'); }
    render();
  });
  $('#q').addEventListener('input', function(e){ state.q = e.target.value.trim().toLowerCase(); renderList(); });
  render();
})();
</script>
</body>
</html>
